<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToDo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="todo-wrapper">
      <header>
        <h1>To Do List</h1>
        <div>2025년 3월 11일 화요일</div>
      </header>

      <main>
        <div>
          <div class="todo-input">
            <input type="text" placeholder="할 일을 입력하세요..." />
            <button id="append-button">추가</button>
          </div>

          <ul class="todo-list">
            <li>
              <label class="todo-item">
                <input type="checkbox" />
                <div>12시 기상</div>
                <button class="delete-button">삭제</button>
              </label>
            </li>
            <li>
              <label class="todo-item">
                <input type="checkbox" />
                <div class="checked-todo-item">12시 기상</div>
                <button class="delete-button">삭제</button>
              </label>
            </li>
          </ul>
        </div>
        <div class="side"></div>
      </main>
    </div>
    <script src="script.js"></script>
  </body>
</html>
